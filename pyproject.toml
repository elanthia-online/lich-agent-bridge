[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lich-agent-bridge"
version = "0.2.0"
description = "Permission-aware agent bridge for Lich 5"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ATARI" }]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
dependencies = []

[project.optional-dependencies]
semantic = ["numpy>=1.26,<3", "onnxruntime>=1.18,<2", "tokenizers>=0.20,<1"]

[project.urls]
Homepage = "https://github.com/elanthia-online/lich-agent-bridge"
Repository = "https://github.com/elanthia-online/lich-agent-bridge"
Issues = "https://github.com/elanthia-online/lich-agent-bridge/issues"

[project.scripts]
lich-agent-bridge = "lich_agent_bridge.server:main"
lab-replay = "lich_agent_bridge.replay:main"
lab-action = "lich_agent_bridge.action_cli:main"
lab-gswiki = "lich_agent_bridge.gswiki:main"
labctl = "lich_agent_bridge.labctl:main"
lab-character-baseline = "lich_agent_bridge.character_baseline:main"
lab-lich-corpus = "lich_agent_bridge.lich_corpus:main"
lab-decisions = "lich_agent_bridge.decisions:main"

[tool.setuptools.packages.find]
where = ["src"]
