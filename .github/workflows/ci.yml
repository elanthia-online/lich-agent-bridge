name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner --log-opts=--all
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -W error::ResourceWarning -m unittest discover -v
      - run: python scripts/check-docs.py
      - run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/lab-wheels" .
  ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
      - run: gem install sqlite3 --no-document
      - run: |
          ruby tests/lab_dispatcher_test.rb
          ruby tests/lab_bridge_test.rb
          ruby tests/lab_combat_report_test.rb
          ruby tests/lab_go2_travel_test.rb
          ruby tests/lab_recovery_test.rb
          ruby tests/despana_state_test.rb
          ruby tests/lab_controller_registry_test.rb
          ruby tests/lab_controller_controls_test.rb
          ruby tests/lab_controller_control_binding_test.rb
          ruby tests/lab_test_runner_test.rb
          ruby tests/lab_inventory_test.rb
          PYTHONPATH=src python3 -m unittest tests.test_script_tests.ScriptSuitePreparationTests.test_shipped_example_preparation_loads_in_python_and_ruby_parsers
          bash tests/play_gemstone_detach_test.sh
  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:sdk-types
      - run: npm run build
